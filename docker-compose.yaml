# 🚀 BionicPRO - Объединенная Docker Compose конфигурация
# Включает: Keycloak, Frontend, Airflow, ClickHouse, Kafka, Redis

# Общая конфигурация для Airflow сервисов
x-airflow-common: &airflow-common
  image: apache/airflow:2.7.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_AIRFLOW_PASSWORD:-airflow}@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: '5_jRTMFBUsDmIv5svBnkDxrieltLKTEJLOn4pmynld4='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Подключения к внешним системам
    AIRFLOW_CONN_CLICKHOUSE_DEFAULT: clickhouse://default:@clickhouse:8123/bionicpro
    AIRFLOW_CONN_KAFKA_DEFAULT: kafka://kafka:9092
    # Переменные для ETL
    AIRFLOW_VAR_BATCH_SIZE_CRM: 5000
    AIRFLOW_VAR_BATCH_SIZE_TELEMETRY: 10000
    AIRFLOW_VAR_ETL_START_DATE: '2024-01-01'
    # Database connections
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 8123
    CLICKHOUSE_DB: bionicpro
    CLICKHOUSE_USER: bionicpro_user
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bionicpro_password}
    REDIS_HOST: redis
    REDIS_PORT: 6379
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/sql:/opt/airflow/sql
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres-airflow:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - bionicpro-network

services:
  # =========================
  # KEYCLOAK И АУТЕНТИФИКАЦИЯ
  # =========================

  keycloak_db:
    image: postgres:14
    container_name: bionicpro-keycloak-db
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD:-keycloak_password}
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bionicpro-network

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    container_name: bionicpro-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD:-keycloak_password}
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
    networks:
      - bionicpro-network

  # =========================
  # FRONTEND
  # =========================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bionicpro-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    depends_on:
      - keycloak
    networks:
      - bionicpro-network

  # =========================
  # БАЗЫ ДАННЫХ И КЕШИРОВАНИЕ
  # =========================

  postgres-airflow:
    image: postgres:13
    container_name: bionicpro-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - bionicpro-network

  redis:
    image: redis:7-alpine
    container_name: bionicpro-redis
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-bionicpro_redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bionicpro_redis_password}", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    networks:
      - bionicpro-network
    volumes:
      - redis-data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: bionicpro-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-bionicpro_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bionicpro_password}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-bionicpro}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./sql/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - bionicpro-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =========================
  # KAFKA ДЛЯ ПОТОКОВЫХ ДАННЫХ
  # =========================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: bionicpro-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bionicpro-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: bionicpro-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - bionicpro-network

  # =========================
  # AIRFLOW СЕРВИСЫ
  # =========================

  airflow-init:
    <<: *airflow-common
    container_name: bionicpro-airflow-init
    entrypoint: /entrypoint
    command: airflow db init
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources

  airflow-webserver:
    <<: *airflow-common
    container_name: bionicpro-airflow-webserver
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: bionicpro-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # =========================
  # REPORTS API BACKEND
  # =========================

  reports-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bionicpro-reports-api
    ports:
      - "5000:5000"
    environment:
      # Flask settings
      FLASK_ENV: production
      FLASK_APP: app.py
      PORT: 5000

      # JWT configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-bionicpro-jwt-secret-2024}

      # ClickHouse connection
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-bionicpro}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-bionicpro_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bionicpro_password}

      # Redis connection
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-bionicpro_redis_password}

      # Security
      ADMIN_USERS: ${ADMIN_USERS:-admin}
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bionicpro-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres-airflow-data:
    name: bionicpro-postgres-airflow-data
  clickhouse-data:
    name: bionicpro-clickhouse-data
  redis-data:
    name: bionicpro-redis-data

networks:
  bionicpro-network:
    driver: bridge