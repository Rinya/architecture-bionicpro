version: '3.8'

services:
  # BionicPRO Reports API Backend
  reports-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bionicpro-reports-api
    ports:
      - "5000:5000"
    environment:
      # Flask settings
      FLASK_ENV: production
      FLASK_APP: app.py

      # JWT configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-bionicpro-jwt-secret-2024}

      # ClickHouse connection
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-bionicpro}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-reports_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-secure_reports_password_2024!}

      # Redis connection
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}

      # Security
      ADMIN_USERS: ${ADMIN_USERS:-admin}

      # Application settings
      PORT: 5000
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - bionicpro-network
    restart: unless-stopped

    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis для кеширования
  redis:
    image: redis:7-alpine
    container_name: bionicpro-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - bionicpro-network
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy (опционально)
  nginx:
    image: nginx:alpine
    container_name: bionicpro-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - reports-api
    networks:
      - bionicpro-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local

networks:
  bionicpro-network:
    driver: bridge
    external: true